apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    runtime.gvisor.dev/enabled: "true"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-nvproxy
handler: runsc-nvproxy
scheduling:
  nodeSelector:
    accelerator: nvidia-gpu
