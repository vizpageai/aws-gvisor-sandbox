name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          package_version = next(
              line.split("=", 1)[1].strip().strip('"')
              for line in pathlib.Path("src/gvisor_sandbox/__init__.py").read_text().splitlines()
              if line.startswith("__version__ =")
          )
          tag = os.environ["RELEASE_TAG"]
          if package_version != version:
              raise SystemExit(f"package __version__ {package_version} does not match pyproject version {version}")
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version v{version}")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
