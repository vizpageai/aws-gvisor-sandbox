name: Bug report
description: Report a reproducible defect in the CLI, Python API, or infrastructure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, Terraform state, customer data, or vulnerability details. Report security issues privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal commands or code with secrets removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI or Python API
        - Terraform or AWS
        - gVisor CPU runtime
        - NVIDIA GPU runtime
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Terraform, AWS region, Kubernetes version, and relevant sanitized logs.
    validations:
      required: true
