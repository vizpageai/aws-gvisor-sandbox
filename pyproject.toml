[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvisor-sandbox"
version = "0.4.0"
description = "AWS EKS platform for reusable CPU/GPU agent sandboxes and jobs with S3/EBS storage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["aws", "eks", "gvisor", "gpu", "sandbox", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "kubernetes>=30.1.0,<37",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
gvisor-sandbox = "gvisor_sandbox.cli:main"

[project.urls]
Homepage = "https://github.com/vizpageai/aws-gvisor-sandbox"
Repository = "https://github.com/vizpageai/aws-gvisor-sandbox.git"
Issues = "https://github.com/vizpageai/aws-gvisor-sandbox/issues"
Security = "https://github.com/vizpageai/aws-gvisor-sandbox/security/advisories/new"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gvisor_sandbox = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
