[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvisor-sandbox"
version = "0.3.0"
description = "AWS EKS platform for reusable CPU/GPU agent sandboxes and jobs with S3/EBS storage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kubernetes>=30.1.0",
]

[project.scripts]
gvisor-sandbox = "gvisor_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
